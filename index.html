<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrace tajného agenta</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="top-secret">⚠ PŘÍSNĚ TAJNÉ ⚠</div>
      <h1>🕵️ REGISTRACE TAJNÉHO AGENTA 🕵️</h1>

      <div id="registrationForm">
        <div class="input-group">
          <label for="agentName">ZADEJ SVÉ AGENTSKÉ JMÉNO:</label>
          <input
            type="text"
            id="agentName"
            placeholder="např. Rozšafný dědula"
            autocomplete="off"
          />
        </div>

        <button class="btn-submit" onclick="registerAgent()">
          🚀 AKTIVOVAT AGENTA
        </button>

        <div id="message"></div>
      </div>

      <div class="footer">
        📋 KLASIFIKACE: TAJNÉ | AGENTURA: MI6 | DATUM: 2025
      </div>
      <br>
      <h6>Web slouží k herním účelům, nezadávejte žádné osobní informace</h6> 
    </div>

    <script>
      async function registerAgent() {
        const name = document.getElementById("agentName").value.trim();

        if (!name) {
          showMessage("❌ Musíš zadat své jméno!", "error");
          return;
        }

        const formData = new FormData();
        formData.append("jmeno", name);

        try {
       /*   const response = await fetch(
            "https://lukas.regularspace.com/agenti/getUser.php",*/
            {
              method: "POST",
              body: formData,
            }
          );

          const text = await response.text();

          if (!response.ok) {
            showMessage(text, "error");
            return;
          }

          const parts = text.split("|");
          if (parts[0] !== "OK") {
            showMessage(text, "error");
            return;
          }

          const agentId = parts[1];

          const agent = {
            id: agentId,
            name: name,
          };

          showAgentInfo(agent);
        } catch (e) {
          showMessage("Chyba spojení se serverem.", "error");
        }
      }

     function showAgentInfo(agent) {
    const messageDiv = document.getElementById("message");
    messageDiv.innerHTML = `
        <div class="agent-info">
            <h2 style="color: #00ff88; margin-bottom: 10px;">✅ REGISTRACE ÚSPĚŠNÁ!</h2>

            <p style="font-size: 20px; margin: 10px 0;">Krycí jméno:</p>

            <div class="agent-number">
                AGENT ${String(agent.id).padStart(3, "0")}
            </div>

            <p style="font-size: 18px; color: #66e0ff; margin-top: 15px;">
                Jméno: ${agent.name}
            </p>

            <p style="font-size: 16px; color: #888; margin-top: 15px;">
                Status: Připraven k misi
            </p>

            <button class="btn-submit" style="margin-top: 20px;" onclick="goToMissions(${agent.id})">
                📋 ZOBRAZIT MISE
            </button>
        </div>
    `;
}

      function goToMissions(agentId) {
    window.location.href = `agent-missions.html?id=${agentId}`;

      }

      function showMessage(text, type) {
        const messageDiv = document.getElementById("message");
        messageDiv.innerHTML = `<div class="${type}-message">${text}</div>`;
      }
    </script>
  </body>
</html>
