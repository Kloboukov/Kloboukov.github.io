<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tajná mise - Agent</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    
    <!-- Knihovny pro export do PDF/PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="container" id="mainContainer">
    <div class="loading" id="loadingDiv">⏳ Načítám agenta...</div>
</div>

<script>
const API_URL = 'https://lukas.regularspace.com/agenti/ab_Agent.php';
let currentAgent = null;

// Seznam misí
const missions = [
    'Nasazení robotů v praxi <h6>Druhé patro</h6>',
    'Otevírání trezoru <h6>Informatika</h6>',
    'Náborový plakátek<h6>Informatika</h6>'
];

// Načíst agenta při načtení stránky
window.addEventListener('DOMContentLoaded', () => {
    loadCurrentAgent();
});

async function loadCurrentAgent() {
    const urlParams = new URLSearchParams(window.location.search);
    const agentId = urlParams.get("id");

    if (!agentId) {
        showError("Agent nenalezen! Přesměrování na registraci...");
        setTimeout(() => window.location.href = 'index.html', 2000);
        return;
    }

    try {
        const formData = new FormData();
        formData.append("Ag_ID", agentId);

        const response = await fetch(API_URL, {
            method: "POST",
            body: formData
        });

        if (!response.ok) throw new Error("Chyba při načítání agenta");

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        currentAgent = data;
        renderPage();

    } catch (e) {
        console.error(e);
        showError("❌ Nepodařilo se načíst agenta. Zkontroluj připojení k serveru.");
    }
}

function allMissionsCompleted() {
    return currentAgent.completed.every(v => v === 1);
}

function renderPage() {
    const container = document.getElementById('mainContainer');

    container.innerHTML = `
        <div class="top-secret">⚠ PŘÍSNĚ TAJNÉ ⚠</div>
        <h1>🕵️ MISE: DEN OTEVŘENÝCH DVEŘÍ 🕵️</h1>

        <div class="agent-name" id="agentDisplay">
            AGENT ${String(currentAgent.id).padStart(3,'0')}
        </div>

        <table class="mission-table">
            <thead>
                <tr>
                    <th style="width: 60%;">NÁZEV ZKOUŠKY</th>
                    <th style="width: 40%;">SPLNĚNO</th>
                </tr>
            </thead>
            <tbody id="missionsTable">
                ${missions.map((mission, index) => {
                    const isCompleted = currentAgent.completed[index] === 1;
                    return `
                        <tr>
                            <td class="mission-name">${mission}</td>
                            <td class="stamp-cell">${isCompleted ? getStampSVG() : ''}</td>
                        </tr>
                    `;
                }).join('')}
            </tbody>
        </table>

        <div class="footer">
            📋 KLASIFIKACE: TAJNÉ | AGENTURA: MI6 | DATUM: 2025
        </div>

        ${allMissionsCompleted() ? `
            <div style="text-align:center; margin-top:20px;">
                <button onclick="downloadDiploma()" class="download-button">
                    📜 Stáhnout diplom
                </button>
            </div>
        ` : ''}
    `;
}

async function downloadDiploma() {
    const agentNumber = String(currentAgent.id).padStart(3, '0');
    const agentName = currentAgent.name;

    try {
        // Načteme HTML šablonu diplomu
        const response = await fetch('ZVLADL-SI-TO.html');
        const originalHtml = await response.text();

        // Získáme základní URL (např. https://kloboukov.github.io/Kloboukov.github.io/)
        const baseURL = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);

        // Nahradíme relativní cesty za absolutní
        let updatedHtml = originalHtml
            .replace('<span id="agentNumber">___</span>', `<span id="agentNumber">${agentNumber}</span>`)
            .replace('<span id="agentName">___________</span>', `<span id="agentName">${agentName}</span>`)
            // Nahradíme všechny relativní cesty absolutními
            .replace(/href="base\.min\.css"/g, `href="${baseURL}base.min.css"`)
            .replace(/href="fancy\.min\.css"/g, `href="${baseURL}fancy.min.css"`)
            .replace(/href="main\.css"/g, `href="${baseURL}main.css"`)
            .replace(/src="compatibility\.min\.js"/g, `src="${baseURL}compatibility.min.js"`)
            .replace(/src="theViewer\.min\.js"/g, `src="${baseURL}theViewer.min.js"`)
            .replace(/src="bg1\.png"/g, `src="${baseURL}bg1.png"`);

        // Vytvoříme dočasný iframe pro vykreslení
        const iframe = document.createElement('iframe');
        iframe.style.position = 'absolute';
        iframe.style.left = '-9999px';
        iframe.style.width = '1920px';
        iframe.style.height = '1080px';
        document.body.appendChild(iframe);

        // Načteme HTML do iframe
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        iframeDoc.open();
        iframeDoc.write(updatedHtml);
        iframeDoc.close();

        // Počkáme na načtení všech zdrojů
        await new Promise(resolve => {
            if (iframe.contentWindow) {
                iframe.contentWindow.addEventListener('load', resolve);
            }
            setTimeout(resolve, 3000); // Delší timeout pro načtení obrázků
        });

        // Vykreslíme do canvasu
        const diplomContent = iframeDoc.getElementById('page-container') || iframeDoc.body;
        
        const canvas = await html2canvas(diplomContent, {
            scale: 2,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#ffffff'
        });

        // Odstraníme iframe
        document.body.removeChild(iframe);

        // Stažení jako PDF
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        
        const pdf = new jsPDF({
            orientation: 'landscape',
            unit: 'mm',
            format: 'a4'
        });
        
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();
        
        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(`Diplom_agent_${agentNumber}.pdf`);

    } catch (error) {
        console.error('Chyba při generování diplomu:', error);
        alert('❌ Nepodařilo se vygenerovat diplom. Zkus to znovu.');
    }
}



// Vrací SVG razítka
function getStampSVG() {
    return `<div class="stamp">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="95" fill="none" stroke="#00ff88" stroke-width="3"/>
            <ellipse cx="100" cy="75" rx="35" ry="8" fill="none" stroke="#00ff88" stroke-width="3"/>
            <path d="M 70 75 Q 70 65 75 60 L 125 60 Q 130 65 130 75" fill="none" stroke="#00ff88" stroke-width="3"/>
            <line x1="75" y1="75" x2="75" y2="82" stroke="#00ff88" stroke-width="3"/>
            <line x1="125" y1="75" x2="125" y2="82" stroke="#00ff88" stroke-width="3"/>
            <path d="M 65 82 L 135 82 Q 137 82 137 85 L 137 88 Q 137 90 135 90 L 65 90 Q 63 90 63 88 L 63 85 Q 63 82 65 82" fill="none" stroke="#00ff88" stroke-width="3"/>
            <circle cx="80" cy="110" r="15" fill="none" stroke="#00ff88" stroke-width="3"/>
            <circle cx="120" cy="110" r="15" fill="none" stroke="#00ff88" stroke-width="3"/>
            <line x1="95" y1="110" x2="105" y2="110" stroke="#00ff88" stroke-width="3"/>
            <path id="circlePath" d="M 100,100 m -75,0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0" fill="none"/>
            <text font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#00ff88">
                <textPath href="#circlePath" startOffset="25%">SPLNĚNO</textPath>
            </text>
        </svg>
    </div>`;
}

// Zobrazení chyby
function showError(message) {
    const container = document.getElementById('mainContainer');
    container.innerHTML = `<div class="error">${message}</div>`;
}
</script>

</body>
</html>
